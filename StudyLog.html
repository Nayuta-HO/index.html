<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StudyLog Pro - 受験勉強・学習記録管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for Interactive Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Inter"', 'sans-serif'],
            mono: ['"Inter"', 'monospace']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
          <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight text-slate-900">StudyLog Pro</h1>
          <p class="text-[11px] text-slate-500" id="header-date-display">2026年11月16日</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>自動保存済
        </span>
        <button id="open-data-modal-btn" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition" title="データ管理・バックアップ">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="max-w-3xl mx-auto px-4 pt-3">
    <div class="grid grid-cols-3 gap-1.5 bg-slate-200/70 p-1 rounded-2xl">
      <button data-tab="home" class="nav-tab-btn active flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition bg-white text-indigo-600 shadow-sm">
        <i class="fa-solid fa-stopwatch"></i>
        <span>ホーム</span>
      </button>
      <button data-tab="analytics" class="nav-tab-btn flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:text-slate-900">
        <i class="fa-solid fa-chart-pie"></i>
        <span>分析・過去問</span>
      </button>
      <button data-tab="bookshelf" class="nav-tab-btn flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:text-slate-900">
        <i class="fa-solid fa-book"></i>
        <span>教材・ログ</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-3xl mx-auto px-4 pt-4 space-y-4">

    <!-- ==================== TAB 1: HOME ==================== -->
    <section id="tab-home" class="tab-content active space-y-4">

      <!-- Daily Goal & Tasks Card -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-4">
        <!-- Time Goal Section -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center">
                <i class="fa-solid fa-fire"></i>
              </div>
              <div>
                <h2 class="font-bold text-sm text-slate-900">デイリー目標</h2>
                <p class="text-xs text-slate-500">今日の学習時間 ＆ テキストノルマ</p>
              </div>
            </div>
            <button id="edit-daily-goal-btn" class="text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
              時間目標変更
            </button>
          </div>

          <div class="flex items-end justify-between mt-3 mb-1.5">
            <div>
              <span id="today-minutes-text" class="text-2xl font-extrabold text-slate-900">0</span>
              <span class="text-xs font-medium text-slate-500">分 / 目標 <span id="daily-goal-target-text">180</span>分</span>
            </div>
            <span id="daily-goal-percent-badge" class="text-xs font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">0%</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div id="daily-goal-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
          <p id="daily-goal-remaining-text" class="text-xs text-slate-500 mt-1.5">目標達成まであと 180 分</p>
        </div>

        <hr class="border-slate-100">

        <!-- Daily Material Tasks / Quota Section -->
        <div>
          <div class="flex items-center justify-between mb-2.5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                <i class="fa-solid fa-list-check text-indigo-600"></i>
                今日のテキスト・問題ノルマ
              </span>
              <span id="daily-task-counter" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">0 / 0 完了</span>
            </div>
            <button id="open-add-task-btn" class="text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1">
              <i class="fa-solid fa-plus"></i>ノルマ追加
            </button>
          </div>

          <!-- Task Progress Bar -->
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-3">
            <div id="daily-task-bar" class="h-full bg-indigo-500 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>

          <!-- Task Checklist -->
          <div id="daily-tasks-list" class="space-y-2">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Study Timer Card -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
              <i class="fa-solid fa-clock"></i>
            </div>
            <div>
              <h2 class="font-bold text-sm text-slate-900">学習タイマー</h2>
              <p class="text-xs text-slate-500">ストップウォッチ計測</p>
            </div>
          </div>
          <button id="open-manual-log-btn" class="text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">
            <i class="fa-solid fa-pen-to-square mr-1"></i>手動で記録
          </button>
        </div>

        <!-- Subject / Material Selector -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-4">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">科目</label>
            <select id="timer-subject-select" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium focus:outline-none focus:border-indigo-500">
              <option value="英語">英語</option>
              <option value="数学">数学</option>
              <option value="国語">国語</option>
              <option value="理科">理科</option>
              <option value="社会">社会</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">使用する教材（任意）</label>
            <select id="timer-material-select" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium focus:outline-none focus:border-indigo-500">
              <option value="">-- 教材を選択しない --</option>
            </select>
          </div>
        </div>

        <!-- Timer Display -->
        <div class="bg-slate-900 text-white rounded-2xl py-6 px-4 text-center mb-4 shadow-inner">
          <div id="timer-display" class="font-mono text-4xl sm:text-5xl font-bold tracking-wider">00:00:00</div>
          <p id="timer-status-text" class="text-xs text-slate-400 mt-1.5">スタートを押して計測開始</p>
        </div>

        <!-- Timer Controls -->
        <div class="grid grid-cols-3 gap-2">
          <button id="timer-start-btn" class="py-2.5 px-3 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-play"></i><span>スタート</span>
          </button>
          <button id="timer-pause-btn" disabled class="py-2.5 px-3 rounded-xl font-bold text-sm bg-amber-500 hover:bg-amber-600 disabled:opacity-40 text-white shadow-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-pause"></i><span>一時停止</span>
          </button>
          <button id="timer-finish-btn" disabled class="py-2.5 px-3 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white shadow-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-check"></i><span>記録する</span>
          </button>
        </div>
      </div>

      <!-- Milestone Card -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm">
        <div class="flex items-center justify-between mb-
