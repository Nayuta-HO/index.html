<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLog Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDK (v10 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-sm">
        <h1 class="font-bold text-lg text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-book-open text-indigo-600"></i> StudyLog Pro
        </h1>
        <button onclick="changeMyName()" class="text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg">
            <i class="fa-solid fa-user-pen mr-1"></i> 名前変更
        </button>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- デイリー目標セクション（元々のあなたの機能） -->
        <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
                        <i class="fa-solid fa-bullseye"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-slate-900">本日の目標</h2>
                        <p class="text-xs text-slate-500">今日も一日頑張りましょう！</p>
                    </div>
                </div>
            </div>
            <div id="daily-goal-area" class="text-xs text-slate-600">
                <!-- デイリー目標の既存コンテンツ -->
                <p>目標時間: 3時間 / 達成度: 0%</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- ★ご指定の場所：デイリー目標と学習タイマーの間 -->
        <!-- ========================================== -->
        <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-slate-900">メンバーのリアルタイム状況</h2>
                        <p class="text-xs text-slate-500">HongoRugby チームで接続中</p>
                    </div>
                </div>
                <span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full animate-pulse">LIVE</span>
            </div>
            <div id="friends-live-list" class="space-y-2">
                <p class="text-xs text-slate-400 text-center py-2">接続を読み込み中...</p>
            </div>
        </div>

        <!-- 学習タイマーセクション（元々のあなたの機能） -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm text-center space-y-4">
            <h2 class="text-sm font-bold text-slate-700">学習タイマー</h2>
            <div id="timer-display" class="text-4xl font-extrabold text-indigo-600 font-mono">00:00:00</div>
            
            <div class="flex gap-2 justify-center">
                <button onclick="startTimer()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-md text-sm transition">
                    <i class="fa-solid fa-play mr-1"></i> スタート
                </button>
                <button onclick="stopTimer()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                    <i class="fa-solid fa-stop mr-1"></i> 終了・記録
                </button>
            </div>
        </div>

        <!-- 本棚・過去問・分析グラフなどその他の機能がここに続きます -->

    </main>

    <!-- Firebase & リアルタイム同期スクリプト -->
    <script>
        // ==========================================
        // Firebase設定情報
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "studylog-7bb39.firebaseapp.com",
            databaseURL: "https://studylog-7bb39-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "studylog-7bb39",
            storageBucket: "studylog-7bb39.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase初期化
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ユーザーIDの取得または自動生成
        let myUserId = localStorage.getItem('studylog_user_id');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('studylog_user_id', myUserId);
        }

        // 自分の名前の初期設定
        let myName = localStorage.getItem('studylog_user_name');
        if (!myName) {
            myName = prompt('あなたのニックネームを入力してください:') || 'メンバー';
            localStorage.setItem('studylog_user_name', myName);
        }

        function changeMyName() {
            const newName = prompt('新しいニックネームを入力してください:', myName);
            if (newName) {
                myName = newName;
                localStorage.setItem('studylog_user_name', myName);
                updateMyPresence(isStudyingNow, "自習");
                alert('名前を「' + myName + '」に変更しました！');
            }
        }

        // 合言葉（グループID）を HongoRugby に設定
        const GROUP_ROOM_ID = 'HongoRugby';
        let isStudyingNow = false;

        // 自分のステータスをFirebaseに送信する関数
        function updateMyPresence(isStudying, subject) {
            isStudyingNow = isStudying;
            const ref = db.ref('rooms/' + GROUP_ROOM_ID + '/users/' + myUserId);
            ref.set({
                name: myName,
                isStudying: isStudying,
                subject: subject || '自習',
                updatedAt: Date.now()
            });
        }

        // メンバーの状況をリアルタイムで監視する関数
        function listenGroupPresence() {
            const ref = db.ref('rooms/' + GROUP_ROOM_ID + '/users');
            ref.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const friendsContainer = document.getElementById('friends-live-list');
                if (!friendsContainer) return;

                let html = '';
                Object.keys(data).forEach(uid => {
                    const user = data[uid];
                    const isMe = (uid === myUserId);
                    const timeAgo = Math.floor((Date.now() - user.updatedAt) / 1000 / 60);

                    // 15分以上更新がない場合はオフライン扱い（自分以外）
                    if (timeAgo > 15 && !isMe) return;

                    const statusBadge = user.isStudying
                        ? `<span class="text-[11px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md animate-pulse">📚 勉強中 (${user.subject})</span>`
                        : `<span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">⚪️ 休憩中</span>`;

                    html += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl ${isMe ? 'bg-indigo-50/60 border border-indigo-100' : 'bg-slate-50 border border-slate-200'}">
                            <div class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full ${user.isStudying ? 'bg-emerald-500' : 'bg-slate-300'}"></span>
                                <span class="text-xs font-bold text-slate-800">${user.name} ${isMe ? '(自分)' : ''}</span>
                            </div>
                            ${statusBadge}
                        </div>
                    `;
                });

                friendsContainer.innerHTML = html || '<p class="text-xs text-slate-400 text-center py-2">メンバーのデータがまだありません</p>';
            });
        }

        // タイマー操作
        function startTimer() {
            updateMyPresence(true, "勉強中");
        }

        function stopTimer() {
            updateMyPresence(false, "");
        }

        // 起動時に監視スタート
        document.addEventListener('DOMContentLoaded', () => {
            listenGroupPresence();
            updateMyPresence(false, "");
        });
    </script>
</body>
</html>
